<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LISA研修">
<meta name="theme-color" content="#1d4ed8">
<title>LISA研修 視聴トラッカー</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri-s:#dbeafe;--ok:#16a34a;--ok-s:#dcfce7;--org:#0891b2;--non:#9333ea;--warn:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2f;--tx:#e8eefc;--sub:#94a3b8;--line:#243049;--pri:#60a5fa;--pri-s:#1e3a6e;--ok:#4ade80;--ok-s:#14352316;--org:#22d3ee;--non:#c084fc}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
h1 small{font-weight:400;color:var(--sub);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok));width:0;transition:width .3s}
.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:4px 0 8px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--sub);padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px #0002}
.tools{display:flex;gap:8px;margin-top:8px}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:15px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:5px 12px;font-size:12px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{padding:12px 16px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.done{border-color:var(--ok);background:linear-gradient(var(--ok-s),var(--ok-s)),var(--card)}
.card.last{outline:2px solid var(--warn)}
.top{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.no{font-size:12px;font-weight:700;color:var(--pri)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;color:#fff}
.tag.o{background:var(--org)}.tag.n{background:var(--non)}.tag.g{background:var(--sub)}
.lastb{font-size:11px;color:#92400e;background:#fef3c7;padding:1px 8px;border-radius:99px}
.desc{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;cursor:pointer}
.desc.open{-webkit-line-clamp:unset}
.parts{display:grid;gap:6px;margin-top:10px}
.part{display:flex;align-items:center;gap:8px}
.chk{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:#fff;font-size:20px;font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok)}
.play{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;background:var(--pri-s);color:var(--pri);text-decoration:none;font-weight:700;font-size:14px}
.part.dn .play{opacity:.55}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
.foot button{border:0;background:none;color:var(--pri);font-size:12px;padding:6px 0}
.memo{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);padding:8px;font:14px/1.5 inherit;min-height:64px}
.note{font-size:11px;color:var(--warn);margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.fab{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
.fab button{border:0;border-radius:14px;height:52px;font-size:15px;font-weight:700;box-shadow:0 4px 14px #0003}
#cont{flex:1;background:var(--pri);color:#fff}
#menu{flex:none;width:52px;background:var(--card);color:var(--tx);border:1px solid var(--line)}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
dialog button{width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px}
dialog textarea{width:100%;height:90px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:12px}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}#lock input{width:100%;max-width:320px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;text-align:center}#lock button{width:100%;max-width:320px;height:48px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15px}#lock p{color:var(--sub);font-size:13px;margin:0}</style>
</head>
<body>
<div id="lock"><b style="font-size:18px">LISA研修 視聴トラッカー</b><input id="pw" type="password" placeholder="合言葉" autocomplete="off"><button id="go">開く</button><p id="err"></p></div>
<header>
  <h1>LISA研修 視聴トラッカー <small id="sum"></small></h1>
  <div class="bar"><i id="pg"></i></div>
  <div class="stat"><span id="s1"></span><span id="s2"></span></div>
  <div class="seg" id="seg"></div>
</header>
<div style="padding:8px 16px 0"><div class="tools" style="margin-top:0"><input id="q" type="search" placeholder="キーワード検索（例：M&A、営業資料）"></div>
  <div class="chips" id="chips"></div></div>
<main id="list"></main>
<div class="fab"><button id="cont">▶ 続きから見る</button><button id="menu">⋯</button></div>

<dialog id="dlg">
  <b>メニュー</b>
  <button id="bk">進捗をコピー（バックアップ）</button>
  <textarea id="ta" placeholder="復元するときはここにバックアップを貼り付け"></textarea>
  <button id="rs">貼り付けた内容で復元</button>
  <button id="rz" style="color:#dc2626">表示中のタブの進捗をリセット</button>
  <button id="cl">閉じる</button>
</dialog>

const b64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},k,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(p));
}
async function tryPw(pw,quiet){
  try{const d=await unlock(pw);try{localStorage.setItem("lisa_pw",pw)}catch(e){}document.getElementById("lock").remove();boot(d)}
  catch(e){if(!quiet)document.getElementById("err").textContent="合言葉が違います";try{localStorage.removeItem("lisa_pw")}catch(_){}}
}
document.getElementById("go").onclick=()=>tryPw(document.getElementById("pw").value.trim());
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click()});
let saved=null;try{saved=localStorage.getItem("lisa_pw")}catch(e){}
if(saved)tryPw(saved,true);
function boot(DATA){
const KEY="lisa_tracker_v1";
let st={done:{},memo:{},last:null,tab:"all",flt:"all",q:""};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

// 正規化
const L=[];
for(const [k,sec] of Object.entries(DATA)){
  sec.list=sec.items.map((it,i)=>{
    const urls=[],notes=[];
    it.slice(1).forEach(x=>x.startsWith("⚠")?notes.push(x):urls.push("https://vimeo.com/"+x.replace("~",x.endsWith("~")?S:"")));
    const d=it[0];
    const tag=d.startsWith("ノンオーガニック")?"n":d.startsWith("オーガニック")?"o":"g";
    return {id:k+(i+1),no:i+1,d,tag,urls,notes,sec:sec.name};
  });
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pk=(it,j)=>it.id+"-"+j;
const isDone=it=>it.urls.every((_,j)=>st.done[pk(it,j)]);
const cnt=it=>it.urls.filter((_,j)=>st.done[pk(it,j)]).length;
const allItems=()=>Object.values(DATA).flatMap(s=>s.list);
const cur=()=>st.tab==="all"?{name:"全部",list:allItems()}:DATA[st.tab];
const itemOf=id=>allItems().find(x=>x.id===id);

function stats(){
  const curL=cur().list,all=allItems();
  const f=a=>[a.filter(isDone).length,a.length];
  const [cd,ct]=f(curL),[ad,at]=f(all);
  document.getElementById("pg").style.width=(ct?cd/ct*100:0)+"%";
  document.getElementById("s1").textContent=`${cur().name}：${cd}/${ct}本 視聴済（${Math.round(cd/ct*100)}%）`;
  document.getElementById("s2").textContent=`全体 ${ad}/${at}`;
  document.getElementById("sum").textContent="";
}

function render(){
  document.getElementById("seg").innerHTML=[["all",{name:"全部",list:allItems()}],...Object.entries(DATA)].map(([k,s])=>{
    const d=s.list.filter(isDone).length;
    return `<button class="${k===st.tab?"on":""}" data-tab="${k}">${s.name}${k==="all"?"":"講師"} ${d}/${s.list.length}</button>`}).join("");
  const F=[["all","すべて"],["todo","未視聴"],["part","視聴中"],["done","視聴済"],["memo","メモあり"],["o","オーガニック"],["n","ノンオーガニック"]];
  document.getElementById("chips").innerHTML=F.map(([k,l])=>`<button class="${k===st.flt?"on":""}" data-f="${k}">${l}</button>`).join("");
  const q=st.q.trim().toLowerCase();
  const rows=cur().list.filter(it=>{
    const c=cnt(it);
    if(st.flt==="todo"&&c)return false;
    if(st.flt==="part"&&!(c&&!isDone(it)))return false;
    if(st.flt==="done"&&!isDone(it))return false;
    if(st.flt==="memo"&&!st.memo[it.id])return false;
    if(st.flt==="o"&&it.tag!=="o")return false;
    if(st.flt==="n"&&it.tag!=="n")return false;
    if(q&&!(it.d.toLowerCase().includes(q)||(st.memo[it.id]||"").toLowerCase().includes(q)))return false;
    return true;
  });
  document.getElementById("list").innerHTML=rows.length?rows.map(card).join(""):`<div class="empty">該当なし</div>`;
  stats();
}

function card(it){
  const c=cnt(it),n=it.urls.length,dn=isDone(it);
  const tg={o:["o","オーガニック"],n:["n","ノンオーガニック"],g:["g","基礎・その他"]}[it.tag];
  const parts=it.urls.map((u,j)=>{
    const on=st.done[pk(it,j)];
    const lb=n>1?`動画${"①②③④"[j]}`:"動画を開く";
    return `<div class="part ${on?"dn":""}"><button class="chk ${on?"on":""}" data-chk="${it.id}|${j}" aria-label="視聴済">${on?"✓":""}</button><a class="play" href="${esc(u)}" target="_blank" rel="noopener" data-open="${it.id}">▶ ${lb}</a></div>`}).join("");
  return `<section class="card ${dn?"done":""} ${st.last===it.id?"last":""}" id="c-${it.id}">
    <div class="top"><span class="no">${st.tab==="all"?it.sec+" ":""}#${it.no}</span><span class="tag ${tg[0]}">${tg[1]}</span>${st.last===it.id?'<span class="lastb">★ 最後に見た</span>':""}</div>
    <div class="desc" data-desc>${esc(it.d)}</div>
    <div class="parts">${parts}</div>
    ${it.notes.map(x=>`<div class="note">${esc(x)}</div>`).join("")}
    <div class="foot"><span>${c}/${n} 視聴済</span><button data-memo="${it.id}">${st.memo[it.id]?"📝 メモを編集":"＋ メモ"}</button></div>
    ${st.memoOpen===it.id?`<textarea class="memo" data-ta="${it.id}" placeholder="気づき・やること">${esc(st.memo[it.id]||"")}</textarea>`:""}
  </section>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-f],[data-chk],[data-open],[data-desc],[data-memo]");
  if(!t)return;
  if(t.dataset.tab){st.tab=t.dataset.tab;save();render();scrollTo(0,0)}
  else if(t.dataset.f){st.flt=t.dataset.f;render()}
  else if(t.dataset.chk){
    const [id,j]=t.dataset.chk.split("|"),k=id+"-"+j;
    st.done[k]?delete st.done[k]:(st.done[k]=1,st.last=id);
    save();const y=scrollY;render();scrollTo(0,y);
  }
  else if(t.dataset.open){st.last=t.dataset.open;save();setTimeout(()=>{const y=scrollY;render();scrollTo(0,y)},300)}
  else if(t.dataset.desc){t.classList.toggle("open")}
  else if(t.dataset.memo){st.memoOpen=st.memoOpen===t.dataset.memo?null:t.dataset.memo;const y=scrollY;render();scrollTo(0,y)}
});
document.addEventListener("input",e=>{
  if(e.target.dataset.ta){const id=e.target.dataset.ta;const v=e.target.value;v?st.memo[id]=v:delete st.memo[id];save()}
  if(e.target.id==="q"){st.q=e.target.value;render()}
});
document.getElementById("q").value=st.q;

// 続きから：最後に見た動画の次の未視聴 → なければ最初の未視聴
document.getElementById("cont").onclick=()=>{
  const list=cur().list;
  let from=0;
  const li=list.findIndex(x=>x.id===st.last);
  if(li>=0)from=li;
  const tgt=list.slice(from).find(x=>!isDone(x))||list.find(x=>!isDone(x));
  if(!tgt){alert("このリストは全部視聴済みです 🎉");return}
  st.flt="all";st.q="";document.getElementById("q").value="";render();
  const el=document.getElementById("c-"+tgt.id);
  el.scrollIntoView({block:"center",behavior:"smooth"});
  el.animate([{transform:"scale(1.03)"},{transform:"scale(1)"}],{duration:400});
};

// メニュー
const dlg=document.getElementById("dlg"),ta=document.getElementById("ta");
document.getElementById("menu").onclick=()=>dlg.showModal();
document.getElementById("cl").onclick=()=>dlg.close();
document.getElementById("bk").onclick=async()=>{
  const s=JSON.stringify({done:st.done,memo:st.memo,last:st.last});
  ta.value=s;try{await navigator.clipboard.writeText(s);alert("コピーしました。メモ等に貼って保管してね")}catch(e){ta.select();alert("コピーできなかったので、欄内のテキストを手動でコピーしてね")}
};
document.getElementById("rs").onclick=()=>{
  try{const o=JSON.parse(ta.value);if(!o.done)throw 0;st.done=o.done;st.memo=o.memo||{};st.last=o.last||null;save();render();dlg.close()}catch(e){alert("形式が正しくないよ")}
};
document.getElementById("rz").onclick=()=>{
  if(!confirm(cur().name+"の進捗をリセットする？（メモは残る）"))return;
  cur().list.forEach(it=>it.urls.forEach((_,j)=>delete st.done[pk(it,j)]));
  save();render();dlg.close();

render();

}
