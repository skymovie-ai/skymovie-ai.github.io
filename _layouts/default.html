<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.url == "/" %}{{ page.title }}{% else %}{{ page.title }}｜Sky Movie{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="Sky Movie">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@ai_naisei_sora">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a1633'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%2338bdf8' font-family='sans-serif' font-weight='bold'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand">Sky Movie<small>AI内製化コンサルティング</small></a>
    <button class="nav-toggle" aria-label="メニュー">メニュー</button>
    <nav class="nav">
      <a href="/" {% if page.url == "/" %}class="active"{% endif %}>ホーム</a>
      <a href="/services/" {% if page.url == "/services/" %}class="active"{% endif %}>サービス・料金</a>
      <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>プロフィール</a>
      <a href="/blog/" {% if page.url contains "/blog" %}class="active"{% endif %}>ブログ</a>
      <a href="/contact/" class="btn small">無料AI診断</a>
    </nav>
  </div>
</header>

{{ content }}

<footer class="site-footer">
  <div class="wrap">
    <div class="cols">
      <div>
        <span class="brand">Sky Movie<small>AIを、内製化する。</small></span>
        <p class="foot-lead">伴走型AI内製化コンサルティング。<br>コードが書けなくても、自社ツールは作れる。</p>
      </div>
      <nav>
        <a href="/">ホーム</a>
        <a href="/services/">サービス・料金</a>
        <a href="/about/">プロフィール</a>
        <a href="/blog/">ブログ</a>
        <a href="/contact/">お問い合わせ</a>
        <a href="https://x.com/ai_naisei_sora" target="_blank" rel="noopener">X @ai_naisei_sora</a>
      </nav>
    </div>
    <p class="copy">© 2026 Sky Movie. All rights reserved.</p>
  </div>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
